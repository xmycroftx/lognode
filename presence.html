<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LogNode Presence</title>
<style>
  :root{
    --bg-base:#0a0c10; --bg-surface:#11141c; --bg-card:#161b26;
    --border-subtle:#242c3d; --text-main:#e2e8f0; --text-muted:#8b9bb4;
    --text-dim:#54647c; --cyan:#38bdf8; --emerald:#10b981; --amber:#f59e0b;
    --rose:#f43f5e; --purple:#a855f7;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg-base);color:var(--text-main);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.5}
  .wrap{max-width:1400px;margin:0 auto;padding:24px 20px 64px}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  h1{font-size:17px;margin:0}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--text-dim);margin:26px 0 10px;font-weight:600}
  nav{margin-left:auto;display:flex;gap:14px;font-size:13px}
  nav a{color:var(--text-muted);text-decoration:none} nav a:hover{color:var(--cyan)}
  select{background:var(--bg-card);border:1px solid var(--border-subtle);color:var(--text-main);
    border-radius:7px;padding:6px 10px;font-size:12.5px;font-family:inherit}
  .sub{color:var(--text-dim);font-size:12.5px;font-family:"JetBrains Mono",ui-monospace,monospace;margin-bottom:18px}
  .host{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:9px;padding:12px 14px;margin-bottom:10px}
  .host h3{margin:0 0 8px;font-size:14px;font-family:"JetBrains Mono",ui-monospace,monospace}
  table{width:100%;border-collapse:collapse;font-size:12.5px;font-family:"JetBrains Mono",ui-monospace,monospace}
  td,th{padding:5px 10px;text-align:left;border-bottom:1px solid var(--border-subtle);vertical-align:top}
  th{color:var(--text-dim);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.6px}
  a.ip{color:var(--cyan);text-decoration:none;border-bottom:1px dotted currentColor}
  .chip{display:inline-block;background:var(--bg-card);border:1px solid var(--border-subtle);
    border-radius:999px;padding:1px 8px;margin:1px 3px 1px 0;font-size:11px;color:var(--text-muted)}
  .active{color:var(--emerald)} .idle{color:var(--text-dim)}
  .alert{background:rgba(244,63,94,0.10);border:1px solid var(--rose);border-radius:9px;padding:12px 14px;margin-bottom:14px}
  .alert h2{color:#fda4af;margin-top:0}
  .empty{color:var(--text-dim);padding:22px 2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Presence — who is on which host</h1>
    <select id="since">
      <option value="1h">last hour</option>
      <option value="24h" selected>last 24 hours</option>
      <option value="7d">last 7 days</option>
      <option value="30d">last 30 days</option>
    </select>
    <nav><a href="/threats">threats</a><a href="/search">search</a><a href="/dashboard">topology</a></nav>
  </header>
  <div class="sub" id="sub">loading…</div>
  <div id="unexpected"></div>
  <div id="hosts"></div>
</div>
<script>
const $ = i => document.getElementById(i);
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const ipLink = ip => ip ? '<a class="ip" href="/search?ip='+esc(ip)+'">'+esc(ip)+'</a>' : '<span class="idle">unknown source</span>';
function fmt(ts){ if(!ts) return ''; const d=new Date(ts*1000); return isNaN(d)?'':
  d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0')+' '+
  String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0')+'Z'; }

async function load(){
  const since = $('since').value;
  $('sub').textContent = 'scanning…';
  const d = await (await fetch('/presence?format=json&since='+since)).json();
  $('sub').innerHTML = '<b>'+d.principal_count+'</b> principals on <b>'+d.host_count+'</b> hosts · window '+esc(d.window);

  $('unexpected').innerHTML = (d.unexpected && d.unexpected.length) ?
    '<div class="alert"><h2>⚠ Unexpected logins</h2>'+
    d.unexpected.map(u=>'<div>'+
      '<span class="chip" style="border-color:var(--rose);color:#fda4af">'+esc(u.kind)+'</span> '+
      '<b>'+esc(u.user)+'</b> on <b>'+esc(u.host)+'</b> from '+ipLink(u.src_ip)+
      ' <span class="idle">('+fmt(u.last_seen)+')</span></div>').join('')+'</div>' : '';

  $('hosts').innerHTML = (d.hosts||[]).filter(h=>h.principals.length).map(h=>
    '<div class="host"><h3>'+esc(h.host)+'</h3>'+
    '<table><thead><tr><th>user</th><th>from</th><th>state</th><th>logins</th><th>sudo</th><th>first</th><th>last</th></tr></thead><tbody>'+
    h.principals.map(p=>'<tr>'+
      '<td><b>'+esc(p.user)+'</b></td>'+
      '<td>'+ipLink(p.src_ip)+'</td>'+
      '<td class="'+(p.active?'active':'idle')+'">'+(p.active?'● active':'idle')+'</td>'+
      '<td>'+p.logins+'</td>'+
      '<td>'+(p.sudo||0)+(p.sudo_failed?' <span style="color:var(--amber)">('+p.sudo_failed+' failed)</span>':'')+'</td>'+
      '<td class="idle">'+fmt(p.first_seen)+'</td>'+
      '<td class="idle">'+fmt(p.last_seen)+'</td>'+
    '</tr>').join('')+'</tbody></table></div>').join('') ||
    '<div class="empty">No interactive logins in this window.</div>';
}
$('since').addEventListener('change', load);
load();
</script>
</body>
</html>
