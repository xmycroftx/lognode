<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LogNode Search</title>
<style>
  :root {
    --bg-base:#0a0c10; --bg-surface:#11141c; --bg-card:#161b26;
    --border-subtle:#242c3d; --border-highlight:#3b82f6;
    --text-main:#e2e8f0; --text-muted:#8b9bb4; --text-dim:#54647c;
    --accent-cyan:#38bdf8; --accent-blue:#3b82f6; --accent-emerald:#10b981;
    --accent-amber:#f59e0b; --accent-rose:#f43f5e; --accent-purple:#a855f7;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg-base);color:var(--text-main);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       font-size:14px;line-height:1.5}
  .wrap{max-width:1500px;margin:0 auto;padding:24px 20px 64px}
  header{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  h1{font-size:17px;margin:0;letter-spacing:.2px}
  header nav{margin-left:auto;display:flex;gap:14px;font-size:13px}
  header nav a{color:var(--text-muted);text-decoration:none}
  header nav a:hover{color:var(--accent-cyan)}

  form{background:var(--bg-surface);border:1px solid var(--border-subtle);
       border-radius:10px;padding:16px}
  .row1{display:flex;gap:10px}
  .row1 input{flex:1}
  input,select{background:var(--bg-card);border:1px solid var(--border-subtle);
    color:var(--text-main);border-radius:7px;padding:9px 11px;
    font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px;min-width:0}
  input:focus,select:focus{outline:none;border-color:var(--border-highlight)}
  button{background:var(--accent-blue);border:1px solid var(--accent-blue);color:#fff;
    border-radius:7px;padding:9px 20px;font-weight:600;font-size:13px;cursor:pointer}
  button:hover{filter:brightness(1.12)}
  .filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
    gap:10px;margin-top:12px}
  .filters label{display:flex;flex-direction:column;gap:5px;
    font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--text-dim)}
  .mode{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
  .mode button{background:transparent;border:1px solid var(--border-subtle);
    color:var(--text-muted);font-weight:500;padding:6px 12px;border-radius:999px;font-size:12px}
  .mode button.on{border-color:var(--accent-cyan);color:var(--accent-cyan);
    background:rgba(56,189,248,.08)}
  .hint{color:var(--text-dim);font-size:12px;margin-top:10px;
        font-family:"JetBrains Mono",ui-monospace,monospace}

  .status{margin:18px 0 10px;color:var(--text-muted);font-size:13px;
          font-family:"JetBrains Mono",ui-monospace,monospace}
  .status b{color:var(--text-main)}
  .err{color:var(--accent-rose)}

  table{width:100%;border-collapse:collapse;font-size:12.5px;
        font-family:"JetBrains Mono",ui-monospace,monospace}
  th{position:sticky;top:0;background:var(--bg-base);text-align:left;
     color:var(--text-dim);font-weight:500;font-size:11px;text-transform:uppercase;
     letter-spacing:.7px;padding:8px 10px;border-bottom:1px solid var(--border-subtle)}
  td{padding:7px 10px;border-bottom:1px solid var(--border-subtle);vertical-align:top}
  tr:hover td{background:var(--bg-surface)}
  .ts{color:var(--text-dim);white-space:nowrap}
  .inst{color:var(--accent-purple);white-space:nowrap}
  .ev{color:var(--accent-emerald);white-space:nowrap}
  .raw{color:var(--text-main);word-break:break-word}
  .kv{color:var(--text-muted);font-size:11.5px;margin-top:3px}
  .kv span{margin-right:12px}
  .kv b{color:var(--text-dim);font-weight:500}
  a.ip{color:var(--accent-cyan);text-decoration:none;border-bottom:1px dotted currentColor}
  a.ip:hover{color:#fff}
  .empty{color:var(--text-dim);padding:28px 4px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>LogNode Search</h1>
    <span class="hint" id="scope"></span>
    <nav>
      <a href="/threats">threats</a>
      <a href="/dashboard">topology</a>
      <a href="/graph/shifts">shifts</a>
      <a href="/stats">stats</a>
    </nav>
  </header>

  <form id="f" autocomplete="off">
    <div class="row1">
      <input id="term" placeholder="an address, a word, a username…  e.g. 127.0.0.1   Failed password   certbot" autofocus>
      <button type="submit">Search</button>
    </div>

    <div class="mode" id="modes">
      <button type="button" data-mode="auto" class="on">Auto</button>
      <button type="button" data-mode="value">Value (any field)</button>
      <button type="button" data-mode="q">Free text</button>
      <button type="button" data-mode="kv">key:value</button>
    </div>

    <div class="filters">
      <label>Host
        <select id="instance"><option value="">any</option></select>
      </label>
      <label>Event
        <input id="event" placeholder="any">
      </label>
      <label>Since
        <select id="since">
          <option value="">all time</option>
          <option value="15m">15 minutes</option>
          <option value="1h">1 hour</option>
          <option value="6h">6 hours</option>
          <option value="24h" selected>24 hours</option>
          <option value="7d">7 days</option>
        </select>
      </label>
      <label>Limit
        <select id="limit">
          <option>50</option><option selected>100</option>
          <option>250</option><option>1000</option>
        </select>
      </label>
    </div>
    <div class="hint" id="explain"></div>
  </form>

  <div class="status" id="status"></div>
  <div id="out"></div>
</div>

<script>
const $ = id => document.getElementById(id);
let mode = 'auto';

const IPRE = /^\d{1,3}(\.\d{1,3}){3}$/;
const IP_IN_TEXT = /\b\d{1,3}(?:\.\d{1,3}){3}\b/g;

// Auto mode picks the filter the term is shaped like. An address goes to
// ?ip= (any kv key) rather than ?q=, because the structured field is indexed
// and exact, where the raw-text match would also hit "192.0.2.10".
function resolveMode(term) {
  if (mode !== 'auto') return mode;
  if (IPRE.test(term)) return 'value';
  if (/^[a-z_][a-z0-9_]*:\S+$/i.test(term)) return 'kv';
  return 'q';
}

function buildURL() {
  const term = $('term').value.trim();
  const p = new URLSearchParams();
  const m = resolveMode(term);
  if (term) {
    if (m === 'value') p.set('ip', term);
    else if (m === 'kv') p.set('kv', term);
    else p.set('q', term);
  }
  for (const [id, key] of [['instance','instance'], ['event','event'], ['since','since']]) {
    const v = $(id).value.trim();
    if (v) p.set(key, v);
  }
  p.set('limit', $('limit').value);
  return { url: '/query?' + p.toString(), mode: m };
}

function describe() {
  const { url, mode: m } = buildURL();
  const label = { value: 'any kv field (indexed, exact)',
                  kv: 'one kv field (indexed, exact)',
                  q: 'raw line contains (trigram-indexed)' }[m];
  $('explain').textContent = url + '   —   ' + label;
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Any address in a result line becomes a link into the topology: the two
// halves of the same question, one click apart.
function linkIPs(text) {
  return esc(text).replace(IP_IN_TEXT, ip =>
    '<a class="ip" href="/graph/subgraph?ip=' + ip + '&depth=1" title="show what ' + ip +
    ' is connected to">' + ip + '</a>');
}

function renderKV(kv) {
  if (!kv || !Object.keys(kv).length) return '';
  const parts = Object.entries(kv).slice(0, 10)
    .map(([k, v]) => '<span><b>' + esc(k) + '</b> ' + linkIPs(v) + '</span>');
  return '<div class="kv">' + parts.join('') + '</div>';
}

async function run(ev) {
  if (ev) ev.preventDefault();
  const { url } = buildURL();
  $('status').textContent = 'searching…';
  $('status').className = 'status';
  try {
    const res = await fetch(url);
    const d = await res.json();
    if (!res.ok || d.error) {
      $('status').className = 'status err';
      $('status').textContent = 'Rejected: ' + (d.error || res.status);
      $('out').innerHTML = '';
      return;
    }
    $('status').innerHTML = '<b>' + d.count + '</b> rows in <b>' + d.query_time_ms + ' ms</b>';
    if (!d.count) {
      $('out').innerHTML = '<div class="empty">Nothing matched. ' +
        'If you searched an address as free text, try <b>Value (any field)</b> — ' +
        'the structured field is exact where the raw line is not.</div>';
      return;
    }
    const rows = d.events.map(e => {
      const inst = (e.labels && e.labels.instance) || '—';
      return '<tr><td class="ts">' + esc((e.timestamp || '').replace('T', ' ').slice(0, 19)) +
             '</td><td class="inst">' + esc(inst) +
             '</td><td class="ev">' + esc(e.event) +
             '</td><td class="raw">' + linkIPs(e.raw || '') + renderKV(e.kv) +
             '</td></tr>';
    }).join('');
    $('out').innerHTML = '<table><thead><tr><th>time</th><th>host</th>' +
      '<th>event</th><th>line</th></tr></thead><tbody>' + rows + '</tbody></table>';
  } catch (err) {
    $('status').className = 'status err';
    $('status').textContent = 'Search failed: ' + err;
  }
}

// Populate the host filter from the graph, so it lists real fleet members.
async function loadHosts() {
  try {
    // Hosts that actually ship logs, not graph nodes -- the graph knows
    // peers and cloud endpoints that never send a line.
    const d = await (await fetch('/instances')).json();
    const names = d.instances || [];
    const sel = $('instance');
    for (const n of names) {
      const o = document.createElement('option');
      o.value = n; o.textContent = n; sel.appendChild(o);
    }
    $('scope').textContent = names.length + ' hosts shipping logs';
  } catch (e) { /* filter just stays "any" */ }
}

$('modes').addEventListener('click', e => {
  const b = e.target.closest('button[data-mode]');
  if (!b) return;
  mode = b.dataset.mode;
  [...$('modes').children].forEach(c => c.classList.toggle('on', c === b));
  describe();
});
$('f').addEventListener('submit', run);
['term','event'].forEach(id => $(id).addEventListener('input', describe));
['instance','since','limit'].forEach(id => $(id).addEventListener('change', () => { describe(); run(); }));

// Deep link: /search?ip=1.2.3.4 or /search?q=certbot
const initial = new URLSearchParams(location.search);
if (initial.get('ip')) { mode = 'value'; $('term').value = initial.get('ip'); }
else if (initial.get('q')) { mode = 'q'; $('term').value = initial.get('q'); }
[...$('modes').children].forEach(c => c.classList.toggle('on', c.dataset.mode === mode));

loadHosts();
describe();
if ($('term').value) run();
</script>
</body>
</html>
