<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LogNode Threats</title>
<style>
  :root{
    --bg-base:#0a0c10; --bg-surface:#11141c; --bg-card:#161b26;
    --border-subtle:#242c3d; --text-main:#e2e8f0; --text-muted:#8b9bb4;
    --text-dim:#54647c; --cyan:#38bdf8; --blue:#3b82f6; --emerald:#10b981;
    --amber:#f59e0b; --rose:#f43f5e; --purple:#a855f7;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg-base);color:var(--text-main);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.5}
  .wrap{max-width:1500px;margin:0 auto;padding:24px 20px 64px}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  h1{font-size:17px;margin:0}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--text-dim);
     margin:30px 0 10px;font-weight:600}
  nav{margin-left:auto;display:flex;gap:14px;font-size:13px}
  nav a{color:var(--text-muted);text-decoration:none}
  nav a:hover{color:var(--cyan)}
  .sub{color:var(--text-dim);font-size:12.5px;font-family:"JetBrains Mono",ui-monospace,monospace;margin-bottom:18px}
  select{background:var(--bg-card);border:1px solid var(--border-subtle);color:var(--text-main);
    border-radius:7px;padding:6px 10px;font-size:12.5px;font-family:inherit}

  /* technique bars */
  .tech{display:grid;grid-template-columns:200px 1fr 60px;gap:10px;align-items:center;
        margin-bottom:5px;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px}
  .tech .bar{background:var(--bg-card);border-radius:3px;height:16px;overflow:hidden}
  .tech .bar i{display:block;height:100%;background:var(--blue)}
  .tech .n{text-align:right;color:var(--text-muted)}
  .sev-critical i{background:var(--rose)} .sev-high i{background:var(--amber)}
  .sev-med i{background:var(--blue)}      .sev-low i{background:var(--text-dim)}
  .tech b{font-weight:500}

  table{width:100%;border-collapse:collapse;font-size:12.5px;
        font-family:"JetBrains Mono",ui-monospace,monospace}
  th{text-align:left;color:var(--text-dim);font-weight:500;font-size:11px;
     text-transform:uppercase;letter-spacing:.6px;padding:7px 10px;
     border-bottom:1px solid var(--border-subtle)}
  td{padding:7px 10px;border-bottom:1px solid var(--border-subtle);vertical-align:top}
  tr:hover td{background:var(--bg-surface)}
  a.ip{color:var(--cyan);text-decoration:none;border-bottom:1px dotted currentColor}
  a.ip:hover{color:#fff}
  .score{font-weight:700}
  .s-crit{color:var(--rose)} .s-high{color:var(--amber)} .s-low{color:var(--text-muted)}
  .chip{display:inline-block;background:var(--bg-card);border:1px solid var(--border-subtle);
        border-radius:999px;padding:1px 8px;margin:1px 3px 1px 0;font-size:11px;color:var(--text-muted)}
  .chip.hot{border-color:var(--rose);color:#fda4af}
  .paths{color:var(--text-dim);font-size:11px;margin-top:4px;word-break:break-all}
  .tells{color:var(--amber);font-size:11px;margin-top:5px;line-height:1.7}
  .camp{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:9px;
        padding:12px 14px;margin-bottom:9px}
  .camp .fp{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;color:var(--text-main)}
  .camp .who{margin-top:6px;font-size:11.5px}
  .note{color:var(--text-dim);font-size:12px;margin-top:8px}
  .empty{color:var(--text-dim);padding:26px 2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Threat activity</h1>
    <select id="since">
      <option value="1h">last hour</option>
      <option value="6h">last 6 hours</option>
      <option value="24h" selected>last 24 hours</option>
      <option value="7d">last 7 days</option>
    </select>
    <nav><a href="/search">search</a><a href="/dashboard">topology</a></nav>
  </header>
  <div class="sub" id="sub">loading…</div>

  <h2>Techniques observed</h2>
  <div id="techniques"></div>

  <h2>Campaigns — actors running the same techniques</h2>
  <div id="campaigns"></div>

  <h2>Networks — who owns the addresses</h2>
  <div id="owners"></div>

  <h2>Actors</h2>
  <div id="actors"></div>
</div>

<script>
const $ = i => document.getElementById(i);

// Severity colouring mirrors the weights in ttp.py: what gets you credentials
// or execution outranks what merely enumerates.
const SEV = {
  "ssrf-metadata":"critical", "rce-attempt":"critical", "webshell-probe":"critical",
  "private-key-theft":"critical",
  "path-traversal":"high", "secret-file-harvest":"high", "backup-hunt":"high",
  "vcs-exposure":"med", "ci-config-exposure":"med", "info-disclosure":"med",
  "cms-probe":"med", "admin-discovery":"med", "api-discovery":"low",
  "mcp-probe":"med", "proxy-probe":"low", "appliance-probe":"med",
  "recon":"low", "unknown":"low"
};
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const ipLink = ip => '<a class="ip" href="/search?ip='+ip+'" title="every log line mentioning '+ip+'">'+ip+'</a>';

function scoreClass(n){ return n>=150?"s-crit":(n>=60?"s-high":"s-low"); }

function fmtDate(s) {
  if (!s) return '';
  try {
    const d = new Date(s);
    if (isNaN(d.getTime())) return String(s);
    const yr = d.getUTCFullYear();
    const mo = String(d.getUTCMonth() + 1).padStart(2, '0');
    const da = String(d.getUTCDate()).padStart(2, '0');
    const hr = String(d.getUTCHours()).padStart(2, '0');
    const mi = String(d.getUTCMinutes()).padStart(2, '0');
    return `${yr}-${mo}-${da} ${hr}:${mi}Z`;
  } catch(e) {
    return String(s);
  }
}

async function load(){
  const since = $('since').value;
  $('sub').textContent = 'scanning…';
  const d = await (await fetch('/threats?since='+since+'&format=json')).json();

  // "scanned" alone is only honest when it equals what matched. When the query
  // stopped short, the window label on this page describes more time than the
  // numbers below it cover, so say so in the same breath as the count.
  const scan = d.truncated
    ? '<span style="color:var(--amber)" title="'+esc(d.truncation_note||'')+'">'+
      d.events_scanned.toLocaleString()+' of '+d.events_matched.toLocaleString()+
      ' requests scanned (most recent)</span>'
    : d.events_scanned.toLocaleString()+' requests scanned';

  $('sub').innerHTML = scan+' · <b>'+
    d.actor_count+'</b> actors · <b>'+d.campaign_count+'</b> campaigns · window '+esc(d.window)+
    (d.enriched ? ' · <span style="color:var(--text-dim)">ownership via '+esc(d.enrichment_source||'')+'</span>' : '') +
    (d.excluded_internal && d.excluded_internal.length
      ? ' · <span style="color:var(--emerald)">'+d.excluded_internal.length+
        ' of our own addresses excluded ('+d.excluded_internal.join(', ')+')</span>' : '');

  const tt = d.technique_totals||{}, max = Math.max(1,...Object.values(tt));
  $('techniques').innerHTML = Object.entries(tt).map(([t,n])=>
    '<div class="tech sev-'+(SEV[t]||"low")+'"><b>'+esc(t)+'</b>'+
    '<span class="bar"><i style="width:'+Math.max(2,100*n/max)+'%"></i></span>'+
    '<span class="n">'+n+'</span></div>').join('') || '<div class="empty">nothing</div>';

  $('campaigns').innerHTML = (d.campaigns||[]).filter(c=>c.actor_count>0).map(c=>{
    const tagHtml = (c.followup_tags||[]).map(t => '<span class="chip" style="border-color:var(--cyan); color:var(--cyan); font-weight:600">🏷️ '+esc(t)+'</span>').join('');
    return '<div class="camp">' +
      '<div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; flex-wrap:wrap; gap:8px">' +
        '<div>' +
          '<span class="chip hot" style="font-weight:700; font-size:12px; background:rgba(244,63,94,0.12)">⚡ ' + esc(c.full_name || c.actor_name) + '</span>' +
          (c.threat_tier ? '<span class="chip ' + (c.threat_tier === "CRITICAL" ? "hot" : "") + '">Tier: ' + esc(c.threat_tier) + '</span>' : '') +
          tagHtml +
        '</div>' +
        '<button onclick="promptTagActor(\'' + esc(c.actor_id) + '\', \'' + esc(c.actor_name) + '\', \'' + esc(c.fingerprint) + '\', \'' + esc(c.emoji || '') + '\')" style="background:var(--bg-card); border:1px solid var(--border-subtle); color:var(--cyan); border-radius:5px; padding:3px 8px; font-size:11px; cursor:pointer">+ Tag Follow-Up</button>' +
      '</div>' +
      '<div class="fp">' +
        c.fingerprint.split('+').map(t=>'<span class="chip'+
          (["critical","high"].includes(SEV[t])?' hot':'')+'">'+esc(t)+'</span>').join('') +
      '</div>' +
      (c.notes ? '<div style="color:var(--amber); font-size:11.5px; margin-top:4px">📝 Note: ' + esc(c.notes) + '</div>' : '') +
      '<div class="who"><b>'+c.actor_count+'</b> address' + (c.actor_count>1?'es':'') + ' · '+c.hits+
        ' hostile requests · targets: '+esc((c.targets||[]).join(', '))+
        (c.first_seen ? '<br><span style="color:var(--text-dim); font-size:11px">🕒 <b>First seen:</b> ' + fmtDate(c.first_seen) + (c.last_seen && c.last_seen !== c.first_seen ? ' &nbsp;·&nbsp; <b>Last seen:</b> ' + fmtDate(c.last_seen) : '') + '</span>' : '') +
        '<br>'+c.actors.map(ipLink).join(' ') + '</div></div>';
  }).join('') || '<div class="empty">No campaigns detected in this window.</div>';

  $('owners').innerHTML = (d.owners||[]).filter(o=>o.asn).slice(0,12).map(o=>
    '<div class="camp"><div class="fp">'+
      '<b>AS'+esc(o.asn)+'</b> '+esc(o.org||'')+
      (o.country?' <span class="chip">'+esc(o.country)+'</span>':'')+
    '</div><div class="who"><b>'+o.actor_count+'</b> address'+(o.actor_count>1?'es':'')+
      ' · '+o.hits+' hostile requests'+
      (o.prefixes&&o.prefixes.length?' · '+esc(o.prefixes.join(' ')):'')+
      '<br>'+o.actors.map(ipLink).join(' ')+'</div></div>').join('')
    || '<div class="empty">'+(d.enriched?'No ownership data returned.':'Ownership lookup disabled.')+'</div>';

  $('actors').innerHTML = '<table><thead><tr><th>score</th><th>address</th><th>seen (UTC)</th><th>owner</th><th>hostile</th>'+
    '<th>targets</th><th>techniques &amp; sample paths</th></tr></thead><tbody>'+
    (d.actors||[]).slice(0,60).map(a=>
      '<tr><td class="score '+scoreClass(a.score)+'">'+a.score+'</td>'+
      '<td>'+ipLink(a.ip)+
        (a.campaign_name ? '<div style="color:var(--purple); font-weight:600; font-size:11px; margin-top:2px">⚡ ' + esc(a.campaign_name) + '</div>' : '')+
        (a.rdns?'<div class="paths">'+esc(a.rdns)+'</div>':'')+
      '</td>'+
      '<td style="white-space:nowrap; font-size:11px; color:var(--text-muted)">'+
        (a.first_seen ? '<div><span style="color:var(--text-dim)">first:</span> ' + fmtDate(a.first_seen) + '</div>' : '')+
        (a.last_seen ? '<div><span style="color:var(--text-dim)">last:</span> ' + fmtDate(a.last_seen) + '</div>' : '')+
      '</td>'+
      '<td>'+(a.country?'<span class="chip">'+esc(a.country)+'</span>':'')+
        (a.org?'<div class="paths">'+esc(a.org.slice(0,34))+'</div>':'')+'</td>'+
      '<td>'+a.hostile_hits+(a.benign_hits?' <span style="color:var(--text-dim)">(+'+a.benign_hits+' benign)</span>':'')+'</td>'+
      '<td>'+esc((a.targets||[]).join(', '))+'</td>'+
      '<td>'+Object.entries(a.techniques).map(([t,n])=>'<span class="chip'+
          (["critical","high"].includes(SEV[t])?' hot':'')+'">'+esc(t)+' '+n+'</span>').join('')+
        '<div class="paths">'+esc((a.sample_paths||[]).slice(0,5).join('  '))+'</div>'+
        ((a.tells&&a.tells.length)?'<div class="tells">'+a.tells.map(t=>'▸ '+esc(t)).join('<br>')+'</div>':'')+
      '</td></tr>').join('')+
    '</tbody></table>';
}

async function promptTagActor(actorId, codename, fingerprint, emoji) {
  const tagsStr = prompt(`Enter follow-up tags for ${emoji || ''} ${codename} (${actorId})\n(comma separated, e.g. firewall-block, monitor-ssh):`);
  if (tagsStr == null) return;
  const notes = prompt(`Optional investigation notes for ${emoji || ''} ${codename}:`) || "";
  const tags = tagsStr.split(',').map(t => t.trim()).filter(Boolean);
  await fetch(`/threats/campaign/${encodeURIComponent(actorId)}/tag`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ followup_tags: tags, notes: notes, codename: codename, emoji: emoji, fingerprint: fingerprint })
  });
  load();
}

$('since').addEventListener('change', load);
load();
</script>
</body>
</html>
